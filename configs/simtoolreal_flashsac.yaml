defaults:
  - flashSAC_base
  - override /env: simtoolreal
  - _self_

group_name: "simtoolreal"
exp_name: "flashsac_paper"
logger_type: "tensorboard"

# Match the official STR training launcher, not the Lab YAML's cumulative default.
# Ten consecutive near-goal policy steps earn one complete goal bonus.
env:
  task_cfg_overrides:
    termination:
      success_steps: 10
      force_consecutive_near_goal_steps: true

# FlashSAC paper-scale GPU-simulator budget.
num_env_steps: 50_000_896
num_train_envs: 1024
num_eval_envs: null
num_record_envs: null
# Isaac Lab exposes only one SimulationApp per process. Reusing the training
# env for evaluation would reset episodes and mutate SimToolReal curriculum.
# Evaluate checkpoints in a separate process instead.
num_eval_episodes: 0
num_record_episodes: 0
evaluation_per_interaction_step: null
# Save ten intermediate checkpoints plus the final checkpoint. Replay stays
# unsaved because a 10M-entry buffer is about 25.5 GB on disk/device.
save_checkpoint_per_interaction_step: 4_439
save_buffer_per_interaction_step: null

updates_per_interaction_step: 2
gamma: 0.99
# The paper reports n=1. Current upstream run_isaaclab.sh uses n=3; override
# this explicitly when reproducing that script revision instead of the paper.
n_step: 1

agent:
  buffer_max_length: 10_000_000
  buffer_min_length: 100_000
  buffer_device_type: "cuda"
  sample_batch_size: 2048
  asymmetric_observation: true
  use_amp: true
