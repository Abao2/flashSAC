##################################################################################
# Dex4D Isaac Lab DirectRLEnv through the external task adapter
##################################################################################

env_type: "isaaclab"
env_name: "FlashSAC-Dex4D-XArm6Leap-Direct-v0"
num_env_steps: ${num_env_steps}

seed: ${seed}
num_train_envs: ${num_train_envs}
num_eval_envs: ${num_eval_envs}
num_record_envs: ${num_record_envs}
rescale_action: null
max_episode_steps: null

# The task package must register env_name after SimulationApp starts.
registration_modules:
  - "robotics_tasks.dex4d"
env_cfg_yaml_entry_point: null
task_cfg_overrides: {}

device: "cuda:0"
headless: true
action_bounds: 1.0
bootstrap_timeouts: false
success_path: "episode_final.success"
