##################################################################################
# SimToolReal through the external Isaac Lab task adapter
##################################################################################

env_type: "isaaclab"
env_name: "Isaacsimenvs-SimToolReal-Direct-v0"
num_env_steps: ${num_env_steps}

seed: ${seed}
num_train_envs: ${num_train_envs}
num_eval_envs: ${num_eval_envs}
num_record_envs: ${num_record_envs}
rescale_action: null
max_episode_steps: null

# Import happens after SimulationApp starts and before Gym resolves env_name.
registration_modules:
  - "isaacsimenvs"

# SimToolReal registers a task YAML on top of its Python EnvCfg. Loading it is
# required: controller smoothing, workspace limits, curriculum and DR live there.
env_cfg_yaml_entry_point: "env_cfg_yaml_entry_point"
task_cfg_overrides: {}

device: "cuda:0"
headless: true
action_bounds: 1.0

# DirectRLEnv auto-resets before returning observations, so there is no genuine
# terminal observation to bootstrap from at a timeout.
bootstrap_timeouts: false

# Whole-trajectory success used by FlashSAC evaluation. Goal count is logged
# separately as episode/final/successes.
success_path: "episode_final.all_goals_hit"
