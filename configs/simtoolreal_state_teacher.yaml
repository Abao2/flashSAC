defaults:
  - simtoolreal_flashsac
  - _self_

# Simulator-state learning diagnostic, NOT a deployable policy or paper result.
# Preserve FlashSAC's network/update recipe and STR's reward/controller math.
group_name: "simtoolreal_diagnostics"
exp_name: "state162_eraser_onegoal_seed0"
seed: 0
num_env_steps: 10_000_384
num_train_envs: 1024
logging_per_interaction_step: 50
metrics_per_interaction_step: 250
save_checkpoint_per_interaction_step: 976

env:
  task_cfg_overrides:
    assets:
      handle_head_types: ["eraser"]
      num_assets_per_type: 1
      shuffle_assets: false
    obs:
      state_list: &teacher_state
        [joint_pos, joint_vel, prev_action_targets, palm_pos, palm_rot, palm_vel,
         object_rot, object_vel, fingertip_pos_rel_palm, keypoints_rel_palm,
         keypoints_rel_goal, object_scales, closest_keypoint_max_dist,
         closest_fingertip_dist, lifted_object, progress, successes, reward]
      obs_list: *teacher_state
    reset:
      # Seed-42 generated eraser collision size: .1460571445 x .0565996971
      # x .0499329242 m. Table top=.38+.15=.53. Start root=top+half_z+1mm.
      fixed_start_pose: [0.0, 0.0, 0.555966462104926, 1.0, 0.0, 0.0, 0.0]
      # One object-root goal, env-local xyz and wxyz: +5cm X, +15cm Z.
      fixed_goal_pose: [0.05, 0.0, 0.705966462104926, 1.0, 0.0, 0.0, 0.0]
      fixed_trajectory_file: ""
      fixed_trajectory_count: 0
      reset_dof_pos_random_interval_arm: 0.0
      reset_dof_pos_random_interval_fingers: 0.0
      reset_dof_vel_random_interval: 0.0
      table_reset_z_range: 0.0
    termination:
      max_consecutive_successes: 1
      # Fixed keypoint threshold .02*1.5=.03m. Keep original success counting.
      success_tolerance: 0.02
      target_success_tolerance: 0.02
    domain_randomization:
      use_obs_delay: false
      use_action_delay: false
      use_object_state_delay_noise: false
      object_state_xyz_noise_std: 0.0
      object_state_rotation_noise_degrees: 0.0
      object_scale_noise_multiplier_range: [1.0, 1.0]
      joint_velocity_obs_noise_std: 0.0
      force_scale: 0.0
      torque_scale: 0.0
      object_friction_scale_range: [1.0, 1.0]
      fingertip_friction_scale_range: [1.0, 1.0]
    action:
      # Author-recommended fast-simulation setting, not the real-robot filter.
      arm_moving_average: 1.0
      hand_moving_average: 1.0
