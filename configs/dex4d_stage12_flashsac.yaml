defaults:
  - flashSAC_base
  - override /env: dex4d
  - _self_

group_name: "dex4d"
exp_name: "flashsac_stage12_bottle"
logger_type: "tensorboard"

# This is a controlled FlashSAC comparison budget, not Dex4D's PPO budget.
num_env_steps: 50_000_896
num_train_envs: 1024
num_eval_envs: null
num_record_envs: null
num_eval_episodes: 0
num_record_episodes: 0
evaluation_per_interaction_step: null
# 48,829 interactions total; save ten intermediate network checkpoints plus
# the final checkpoint. Replay is saved only at the end.
save_checkpoint_per_interaction_step: 4_439
save_buffer_per_interaction_step: 48_829

updates_per_interaction_step: 2
gamma: 0.99
n_step: 1

env:
  env_name: "FlashSAC-Dex4D-XArm6Leap-Stage12-Direct-v0"
  # The official PPO stage-1/2 curriculum matures at 15k/25k iterations
  # (60% of its budget). Preserve that fraction in this 48,829-step run.
  task_cfg_overrides:
    curriculum_policy_step: 29_297

agent:
  asymmetric_observation: false
  buffer_max_length: 1_000_000
  buffer_min_length: 100_000
  buffer_device_type: "cuda"
  sample_batch_size: 2048
  use_amp: true
